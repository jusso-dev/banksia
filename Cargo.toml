[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jusso-dev/banksia"
rust-version = "1.89"
publish = false

[workspace.dependencies]
anyhow = "1"
url = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query", "http2", "stream"] }
percent-encoding = "2"
aws-lc-rs = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "net"] }
object_store = { version = "0.14", features = ["azure", "aws"] }
bytes = "1"
futures = "0.3"
base64 = "0.22"
hex = "0.4"
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
chacha20poly1305 = "0.11"
getrandom = "0.4"
zeroize = "1"
toml = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"

banksia-core = { path = "crates/banksia-core" }
banksia-graph = { path = "crates/banksia-graph" }
banksia-fakegraph = { path = "crates/banksia-fakegraph" }
banksia-quickxor = { path = "crates/banksia-quickxor" }

[profile.release]
lto = "thin"
strip = "symbols"
